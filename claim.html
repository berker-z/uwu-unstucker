<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>uwu-unstucker</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111314;
        color: #eef2ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(120deg, rgba(57, 141, 109, 0.18), transparent 38%),
          linear-gradient(250deg, rgba(207, 72, 78, 0.16), transparent 34%),
          #111314;
      }

      main {
        width: min(1160px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 3vw, 36px);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #bcc9c0;
      }

      button {
        appearance: none;
        border: 1px solid #33413a;
        border-radius: 7px;
        background: #eef2ee;
        color: #111314;
        min-height: 40px;
        padding: 0 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #1b201d;
        color: #eef2ee;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      label {
        display: grid;
        gap: 7px;
        color: #dce5de;
        font-size: 13px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #33413a;
        border-radius: 7px;
        background: #191d1b;
        color: #eef2ee;
        padding: 10px;
        font: inherit;
      }

      textarea {
        min-height: 132px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.45;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }

      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 12px 0;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #dce5de;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0;
      }

      .status {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }

      .metric {
        min-height: 74px;
        border: 1px solid #29342f;
        border-radius: 7px;
        background: rgba(21, 25, 23, 0.86);
        padding: 12px;
      }

      .metric span {
        display: block;
        color: #9fafa5;
        font-size: 12px;
        margin-bottom: 7px;
      }

      .metric strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 14px;
      }

      pre {
        min-height: 360px;
        max-height: 62vh;
        overflow: auto;
        border: 1px solid #29342f;
        border-radius: 7px;
        background: rgba(11, 13, 12, 0.88);
        padding: 14px;
        color: #dfe8e2;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .danger {
        color: #ffb3b3;
      }

      @media (max-width: 820px) {
        main {
          width: min(100vw - 22px, 1160px);
          padding: 18px 0;
        }

        .controls,
        .status {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>uwu-unstucker</h1>
          <p>Local Solana claim transaction rebuilder</p>
        </div>
        <button id="connect">Connect</button>
      </header>

      <section class="status" aria-live="polite">
        <div class="metric">
          <span>Wallet</span>
          <strong id="wallet">Not connected</strong>
        </div>
        <div class="metric">
          <span>Captured TX</span>
          <strong id="captured">Not analyzed</strong>
        </div>
        <div class="metric">
          <span>Rebuild</span>
          <strong id="rebuild">Not run</strong>
        </div>
        <div class="metric">
          <span>Simulation</span>
          <strong id="simulation">Not run</strong>
        </div>
      </section>

      <label>
        Captured base64 transaction
        <textarea id="payload" spellcheck="false" autocomplete="off"></textarea>
      </label>

      <section class="controls">
        <label>
          RPC endpoint
          <input id="rpc">
        </label>
        <label>
          Compute unit price, micro-lamports
          <input id="cuPrice" inputmode="numeric" value="1000000">
        </label>
        <label>
          Compute unit limit
          <input id="cuLimit" inputmode="numeric" value="2000000">
        </label>
      </section>

      <section class="toggles">
        <label class="toggle">
          <input id="omitTopups" type="checkbox" checked>
          Omit sponsor SOL top-ups
        </label>
        <label class="toggle">
          <input id="skipExistingAta" type="checkbox" checked>
          Skip existing ATA creates
        </label>
      </section>

      <section class="actions">
        <button id="analyze">Analyze pasted tx</button>
        <button id="prepare">Build, sign, simulate</button>
        <button id="send" class="secondary" disabled>Send simulated transaction</button>
        <button id="clear" class="secondary">Clear log</button>
      </section>

      <pre id="log"></pre>
    </main>

    <script type="module">
      import {
        Connection,
        PublicKey,
        TransactionInstruction,
        TransactionMessage,
        VersionedTransaction,
        ComputeBudgetProgram,
        SystemProgram,
        LAMPORTS_PER_SOL
      } from "https://esm.sh/@solana/web3.js@1.95.3?bundle&target=es2022";

      const ASSOCIATED_TOKEN_PROGRAM = new PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL");
      const COMPUTE_BUDGET_PROGRAM = new PublicKey("ComputeBudget111111111111111111111111111111");
      const MAX_SOLANA_TX_BYTES = 1232;

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      const walletEl = $("wallet");
      const capturedEl = $("captured");
      const rebuildEl = $("rebuild");
      const simulationEl = $("simulation");
      const connectBtn = $("connect");
      const analyzeBtn = $("analyze");
      const prepareBtn = $("prepare");
      const sendBtn = $("send");

      let provider;
      let connectedWallet;
      let connection;
      let captured;
      let signedTransaction;
      let latestBlockhash;

      function log(...items) {
        const line = items.map((item) => {
          if (item instanceof Error) return item.stack || item.message;
          if (typeof item === "string") return item;
          return JSON.stringify(item, null, 2);
        }).join(" ");
        console.log(...items);
        logEl.textContent += line + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setMetric(element, text, failed = false) {
        element.textContent = text;
        element.classList.toggle("danger", failed);
      }

      function toSol(lamports) {
        const value = typeof lamports === "bigint" ? lamports : BigInt(lamports);
        const whole = value / BigInt(LAMPORTS_PER_SOL);
        const fraction = (value % BigInt(LAMPORTS_PER_SOL)).toString().padStart(9, "0");
        return `${whole}.${fraction}`;
      }

      function short(value) {
        return `${value.slice(0, 5)}...${value.slice(-5)}`;
      }

      function keyString(pubkey) {
        return pubkey.toBase58();
      }

      function inSet(pubkey, set) {
        return set.has(keyString(pubkey));
      }

      function fromB64(value) {
        return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      }

      function readU32LE(bytes, offset = 0) {
        return new DataView(bytes.buffer, bytes.byteOffset + offset, 4).getUint32(0, true);
      }

      function readU64LE(bytes, offset = 0) {
        return new DataView(bytes.buffer, bytes.byteOffset + offset, 8).getBigUint64(0, true);
      }

      function safeNumber(bigint, label) {
        if (bigint > BigInt(Number.MAX_SAFE_INTEGER)) {
          throw new Error(`${label} is too large for this browser tool.`);
        }
        return Number(bigint);
      }

      function getProvider() {
        const candidate = window.phantom?.solana || window.solana;
        if (!candidate) throw new Error("No Phantom/Solana wallet provider found in this browser profile.");
        if (candidate.isPhantom === false) throw new Error("A Solana wallet provider exists, but it is not Phantom.");
        return candidate;
      }

      function getConnection() {
        const endpoint = $("rpc").value.trim();
        if (!endpoint) throw new Error("RPC endpoint is empty.");
        connection = new Connection(endpoint, "confirmed");
        return connection;
      }

      function positiveIntegerFromInput(id, label) {
        const raw = $(id).value.trim();
        if (!/^[0-9]+$/.test(raw)) throw new Error(`${label} must be a positive integer.`);
        const value = Number(raw);
        if (!Number.isSafeInteger(value) || value <= 0) throw new Error(`${label} is outside a safe integer range.`);
        return value;
      }

      function looksLikeBase64(value) {
        return value.length >= 80 && value.length % 4 === 0 && /^[A-Za-z0-9+/=]+$/.test(value);
      }

      function findBase64Candidate(value) {
        if (typeof value === "string") {
          const compact = value.trim().replace(/\s+/g, "");
          return looksLikeBase64(compact) ? compact : undefined;
        }
        if (Array.isArray(value)) {
          return value.map(findBase64Candidate).find(Boolean);
        }
        if (value && typeof value === "object") {
          const preferredKeys = ["transaction", "tx", "payload", "serializedTransaction", "signedTransaction"];
          for (const key of preferredKeys) {
            const found = findBase64Candidate(value[key]);
            if (found) return found;
          }
          return Object.values(value).map(findBase64Candidate).find(Boolean);
        }
        return undefined;
      }

      function extractBase64Payload(raw) {
        const trimmed = raw.trim();
        if (!trimmed) throw new Error("Paste a captured base64 transaction first.");

        try {
          const parsed = JSON.parse(trimmed);
          const found = findBase64Candidate(parsed);
          if (found) return found;
        } catch {
          // Raw base64 is the common case.
        }

        const compact = trimmed.replace(/^"|"$/g, "").replace(/\s+/g, "");
        if (!looksLikeBase64(compact)) {
          throw new Error("Could not find a base64 transaction in the pasted text.");
        }
        return compact;
      }

      function signatureState(signature) {
        return signature.some((byte) => byte !== 0) ? "present" : "missing";
      }

      async function loadLookupTables(message, rpc) {
        const lookups = message.addressTableLookups || [];
        if (lookups.length === 0) return [];

        const tables = [];
        for (const lookup of lookups) {
          const result = await rpc.getAddressLookupTable(lookup.accountKey);
          if (!result.value) {
            throw new Error(`Address lookup table not found: ${lookup.accountKey.toBase58()}`);
          }
          tables.push(result.value);
        }
        return tables;
      }

      function decompileMessage(tx, lookupTables) {
        return TransactionMessage.decompile(tx.message, {
          addressLookupTableAccounts: lookupTables
        });
      }

      function parseComputeBudget(instruction) {
        if (!instruction.programId.equals(COMPUTE_BUDGET_PROGRAM)) return undefined;
        const data = instruction.data;
        if (data.length === 5 && data[0] === 2) {
          return { kind: "limit", units: readU32LE(data, 1) };
        }
        if (data.length === 9 && data[0] === 3) {
          return { kind: "price", microLamports: safeNumber(readU64LE(data, 1), "Compute unit price") };
        }
        return { kind: "other" };
      }

      function parseSystemTransfer(instruction) {
        if (!instruction.programId.equals(SystemProgram.programId)) return undefined;
        if (instruction.keys.length < 2 || instruction.data.length !== 12) return undefined;
        if (readU32LE(instruction.data, 0) !== 2) return undefined;

        return {
          from: instruction.keys[0].pubkey,
          to: instruction.keys[1].pubkey,
          lamports: readU64LE(instruction.data, 4)
        };
      }

      function isAssociatedTokenCreate(instruction) {
        if (!instruction.programId.equals(ASSOCIATED_TOKEN_PROGRAM)) return false;
        if (instruction.keys.length < 6) return false;
        return instruction.data.length === 0 || (instruction.data.length === 1 && (instruction.data[0] === 0 || instruction.data[0] === 1));
      }

      function cloneInstruction(instruction, keys) {
        return new TransactionInstruction({
          programId: instruction.programId,
          keys,
          data: instruction.data
        });
      }

      function summarizeInstruction(instruction, index) {
        const compute = parseComputeBudget(instruction);
        if (compute?.kind === "price") {
          return `${index}: compute price ${compute.microLamports}`;
        }
        if (compute?.kind === "limit") {
          return `${index}: compute limit ${compute.units}`;
        }
        const transfer = parseSystemTransfer(instruction);
        if (transfer) {
          return `${index}: system transfer ${toSol(transfer.lamports)} SOL ${short(keyString(transfer.from))} -> ${short(keyString(transfer.to))}`;
        }
        const ata = isAssociatedTokenCreate(instruction) ? " ATA create" : "";
        return `${index}:${ata} ${instruction.programId.toBase58()} accounts=${instruction.keys.length} data=${instruction.data.length}`;
      }

      async function connectWallet() {
        provider = getProvider();
        const result = await provider.connect();
        connectedWallet = result.publicKey;
        walletEl.textContent = connectedWallet.toBase58();
        log("Connected wallet:", connectedWallet.toBase58());
      }

      async function analyzeCapturedTransaction() {
        const rpc = getConnection();
        const b64 = extractBase64Payload($("payload").value);
        const raw = fromB64(b64);
        const tx = VersionedTransaction.deserialize(raw);
        const lookupTables = await loadLookupTables(tx.message, rpc);
        const decompiled = decompileMessage(tx, lookupTables);
        const requiredSignerCount = tx.message.header.numRequiredSignatures;
        const signers = tx.message.staticAccountKeys.slice(0, requiredSignerCount).map((pubkey, index) => ({
          pubkey,
          signature: tx.signatures[index],
          state: signatureState(tx.signatures[index])
        }));

        for (const instruction of decompiled.instructions) {
          const compute = parseComputeBudget(instruction);
          if (compute?.kind === "price") $("cuPrice").value = String(compute.microLamports);
          if (compute?.kind === "limit") $("cuLimit").value = String(compute.units);
        }

        captured = {
          b64,
          raw,
          tx,
          lookupTables,
          instructions: decompiled.instructions,
          signers
        };

        signedTransaction = undefined;
        latestBlockhash = undefined;
        sendBtn.disabled = true;
        setMetric(capturedEl, `${raw.length} bytes, ${signers.length} signer(s)`);
        setMetric(rebuildEl, "Not run");
        setMetric(simulationEl, "Not run");

        log("Captured transaction analyzed.");
        log("Version:", tx.message.version ?? "legacy");
        log("Original payer:", tx.message.staticAccountKeys[0].toBase58());
        log("Required signers:");
        signers.forEach((signer, index) => {
          log(`  ${index}: ${signer.pubkey.toBase58()} signature=${signer.state}`);
        });
        log("Address lookup tables:", lookupTables.length);
        log("Instructions:");
        captured.instructions.forEach((instruction, index) => log(" ", summarizeInstruction(instruction, index)));

        return captured;
      }

      async function maybeAnalyze() {
        if (!captured) return analyzeCapturedTransaction();
        const current = extractBase64Payload($("payload").value);
        if (current !== captured.b64) return analyzeCapturedTransaction();
        return captured;
      }

      async function transformInstructions(rpc, analysis) {
        const computeUnitPrice = positiveIntegerFromInput("cuPrice", "Compute unit price");
        const computeUnitLimit = positiveIntegerFromInput("cuLimit", "Compute unit limit");
        const unavailableSignerSet = new Set(
          analysis.signers
            .map((signer) => signer.pubkey)
            .filter((pubkey) => !pubkey.equals(connectedWallet))
            .map(keyString)
        );

        const connectedWasRequiredSigner = analysis.signers.some((signer) => signer.pubkey.equals(connectedWallet));
        if (!connectedWasRequiredSigner) {
          throw new Error("Connected wallet is not a required signer in the captured transaction.");
        }

        const transformed = [
          ComputeBudgetProgram.setComputeUnitPrice({ microLamports: computeUnitPrice }),
          ComputeBudgetProgram.setComputeUnitLimit({ units: computeUnitLimit })
        ];

        const stats = {
          computeSkipped: 0,
          topupsOmitted: 0,
          ataPayersRewritten: 0,
          ataCreatesSkipped: 0,
          kept: 0
        };

        for (let index = 0; index < analysis.instructions.length; index += 1) {
          const instruction = analysis.instructions[index];

          if (instruction.programId.equals(COMPUTE_BUDGET_PROGRAM)) {
            stats.computeSkipped += 1;
            continue;
          }

          const transfer = parseSystemTransfer(instruction);
          if (
            $("omitTopups").checked &&
            transfer &&
            inSet(transfer.from, unavailableSignerSet) &&
            transfer.to.equals(connectedWallet)
          ) {
            stats.topupsOmitted += 1;
            log(`Omitting sponsor SOL top-up at instruction ${index}: ${toSol(transfer.lamports)} SOL`);
            continue;
          }

          if (isAssociatedTokenCreate(instruction)) {
            const keys = instruction.keys.map((key) => ({ ...key }));
            const payer = keys[0];
            const ata = keys[1]?.pubkey;

            if (ata && $("skipExistingAta").checked) {
              const info = await rpc.getAccountInfo(ata, "confirmed");
              if (info) {
                stats.ataCreatesSkipped += 1;
                log(`Skipping existing ATA at instruction ${index}: ${ata.toBase58()}`);
                continue;
              }
            }

            if (payer && inSet(payer.pubkey, unavailableSignerSet)) {
              keys[0] = { pubkey: connectedWallet, isSigner: true, isWritable: true };
              stats.ataPayersRewritten += 1;
              log(`Rewriting ATA payer at instruction ${index}: ${payer.pubkey.toBase58()} -> ${connectedWallet.toBase58()}`);
            }

            if (keys.some((key) => key.isSigner && inSet(key.pubkey, unavailableSignerSet))) {
              throw new Error(`Instruction ${index} still needs an unavailable signer after ATA rewrite.`);
            }

            transformed.push(cloneInstruction(instruction, keys));
            stats.kept += 1;
            continue;
          }

          const unavailableSigner = instruction.keys.find((key) => key.isSigner && inSet(key.pubkey, unavailableSignerSet));
          if (unavailableSigner) {
            throw new Error(
              `Instruction ${index} still requires unavailable signer ${unavailableSigner.pubkey.toBase58()}. ` +
              "This tool can only remove sponsor-style fee payers, ATA payers, and sponsor top-up transfers."
            );
          }

          const keys = instruction.keys.map((key) => ({
            pubkey: key.pubkey,
            isSigner: key.pubkey.equals(connectedWallet) ? true : key.isSigner,
            isWritable: key.isWritable
          }));
          transformed.push(cloneInstruction(instruction, keys));
          stats.kept += 1;
        }

        return { instructions: transformed, stats };
      }

      async function buildSignAndSimulate() {
        sendBtn.disabled = true;
        signedTransaction = undefined;
        latestBlockhash = undefined;
        setMetric(rebuildEl, "Running");
        setMetric(simulationEl, "Not run");

        if (!connectedWallet) await connectWallet();

        const rpc = getConnection();
        const analysis = await maybeAnalyze();
        const walletLamports = await rpc.getBalance(connectedWallet, "confirmed");
        log("Wallet SOL:", toSol(walletLamports));

        const { instructions, stats } = await transformInstructions(rpc, analysis);
        latestBlockhash = await rpc.getLatestBlockhash("confirmed");

        const message = new TransactionMessage({
          payerKey: connectedWallet,
          recentBlockhash: latestBlockhash.blockhash,
          instructions
        }).compileToV0Message(analysis.lookupTables);

        const transaction = new VersionedTransaction(message);
        if (transaction.signatures.length !== 1) {
          throw new Error(`Expected one required signature after rebuild, got ${transaction.signatures.length}.`);
        }

        const unsignedSize = transaction.serialize().length;
        if (unsignedSize > MAX_SOLANA_TX_BYTES) {
          throw new Error(`Rebuilt transaction is ${unsignedSize} bytes; Solana max is ${MAX_SOLANA_TX_BYTES}.`);
        }

        log("Rebuild stats:", stats);
        log("Rebuilt transaction bytes:", unsignedSize);
        log("Rebuilt transaction signer:", connectedWallet.toBase58());
        log("Blockhash:", latestBlockhash.blockhash);
        log("Last valid block height:", latestBlockhash.lastValidBlockHeight);
        setMetric(rebuildEl, `${unsignedSize} bytes`);
        log("Requesting Phantom signature...");

        signedTransaction = await provider.signTransaction(transaction);
        if (signedTransaction.signatures[0].every((byte) => byte === 0)) {
          throw new Error("Phantom returned a transaction with an empty signature.");
        }

        log("Simulating with signature verification...");
        setMetric(simulationEl, "Running");
        const simulation = await rpc.simulateTransaction(signedTransaction, {
          sigVerify: true,
          commitment: "processed"
        });

        log("Simulation error:", simulation.value.err || "OK");
        if (simulation.value.unitsConsumed !== undefined) log("Units consumed:", simulation.value.unitsConsumed);
        if (simulation.value.logs?.length) log(simulation.value.logs.join("\n"));

        if (simulation.value.err) {
          setMetric(simulationEl, "Failed", true);
          signedTransaction = undefined;
          latestBlockhash = undefined;
          return;
        }

        setMetric(simulationEl, "OK");
        sendBtn.disabled = false;
        log("Simulation OK. The send button is now enabled.");
      }

      async function sendSignedTransaction() {
        if (!signedTransaction || !latestBlockhash || !connection) {
          throw new Error("No simulated transaction is ready to send.");
        }

        const confirmed = window.confirm("Simulation was OK. Send this signed mainnet transaction now?");
        if (!confirmed) {
          log("Send cancelled by user.");
          return;
        }

        sendBtn.disabled = true;
        log("Sending raw transaction...");

        const signature = await connection.sendRawTransaction(signedTransaction.serialize(), {
          skipPreflight: false,
          maxRetries: 5
        });

        log("SENT:", signature);
        log("Solscan:", `https://solscan.io/tx/${signature}`);
        log("Waiting for confirmation...");

        const confirmation = await connection.confirmTransaction({
          signature,
          blockhash: latestBlockhash.blockhash,
          lastValidBlockHeight: latestBlockhash.lastValidBlockHeight
        }, "confirmed");

        log("Confirmation:", confirmation.value.err || "confirmed");
        if (confirmation.value.err) setMetric(simulationEl, "Confirm failed", true);
      }

      connectBtn.addEventListener("click", async () => {
        try {
          await connectWallet();
        } catch (error) {
          log("ERROR:", error);
        }
      });

      analyzeBtn.addEventListener("click", async () => {
        try {
          await analyzeCapturedTransaction();
        } catch (error) {
          captured = undefined;
          setMetric(capturedEl, "Failed", true);
          log("ERROR:", error);
        }
      });

      prepareBtn.addEventListener("click", async () => {
        try {
          await buildSignAndSimulate();
        } catch (error) {
          setMetric(rebuildEl, "Failed", true);
          setMetric(simulationEl, "Failed", true);
          sendBtn.disabled = true;
          signedTransaction = undefined;
          latestBlockhash = undefined;
          log("ERROR:", error);
        }
      });

      sendBtn.addEventListener("click", async () => {
        try {
          await sendSignedTransaction();
        } catch (error) {
          log("ERROR:", error);
          sendBtn.disabled = false;
        }
      });

      $("payload").addEventListener("input", () => {
        captured = undefined;
        signedTransaction = undefined;
        latestBlockhash = undefined;
        sendBtn.disabled = true;
        setMetric(capturedEl, "Not analyzed");
        setMetric(rebuildEl, "Not run");
        setMetric(simulationEl, "Not run");
      });

      $("clear").addEventListener("click", () => {
        logEl.textContent = "";
      });

      $("rpc").value = `${window.location.origin}/rpc`;

      log("Ready.");
      log("Paste a captured failed transaction, connect the same wallet, simulate, then send only after a clean result.");
    </script>
  </body>
</html>
